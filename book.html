<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="reader">

        <div id="content">Loading...</div>

        <div class="controls">
            <button onclick="prevPage()">← Previous</button>
            <span id="page-number">Page 0</span>
            <button onclick="nextPage()">Next →</button>
        </div>

    </div>

    <script>
        let currentPage = 0;

        async function loadPage(page) {
            const fileName = String(page).padStart(4, '0') + ".md";

            try {
                const response = await fetch("book/" + fileName);
                const text = await response.text();

                document.getElementById("content").innerHTML = marked.parse(text);
                document.getElementById("page-number").innerText = "Page " + page;

                currentPage = page;

                // Save progress
                localStorage.setItem("bookPage", page);

            } catch (err) {
                document.getElementById("content").innerHTML = "Page not found.";
            }
        }

        function nextPage() {
            loadPage(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 0) loadPage(currentPage - 1);
        }

        // Load saved page or start at 0
        const saved = localStorage.getItem("bookPage");
        loadPage(saved ? parseInt(saved) : 0);
    </script>

</body>

</html>
