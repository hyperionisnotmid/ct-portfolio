<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js library for Markdown parsing -->
    <script src="marked.min.js"></script>
</head>

<body>
    <div class="reader">
        <h1 id="chapter-title">Loading...</h1>
        <div id="content"></div>

        <div class="controls">
            <button onclick="changeChapter(-1)">← Previous</button>
            <span id="page-number">Chapter 1</span>
            <button onclick="changeChapter(1)">Next →</button>
        </div>
    </div>

    <script>
        let currentChapter = 0; // Starts at 0000.md

        async function loadChapter(num) {
            // This converts the number 1 into "0001"
            const paddedNum = num.toString().padStart(4, '0');
            const contentDiv = document.getElementById('content');

            try {
                const response = await fetch(`./chapters/${paddedNum}.md`);

                if (!response.ok) throw new Error("File not found");

                const rawText = await response.text();

                // If your .md files have Frontmatter (the stuff between ---), 
                // this regex strips it out so it doesn't show up on the page.
                const cleanText = rawText.replace(/^---[\s\S]*?---/, '');

                contentDiv.innerHTML = marked.parse(cleanText);
                document.getElementById('page-number').innerText = `Chapter ${paddedNum}`;

                // Scroll back to top when chapter changes
                window.scrollTo(0, 0);

            } catch (err) {
                contentDiv.innerHTML = "<p style='text-align:center;'>Chapter not found or end of book reached.</p>";
            }
        }

        function changeChapter(step) {
            currentChapter += step;
            if (currentChapter < 0) currentChapter = 0;
            if (currentChapter > 200) currentChapter = 200;
            loadChapter(currentChapter);
        }

        // Load the first chapter (0000.md) on startup
        loadChapter(currentChapter);
    </script>

</body>

</html>
